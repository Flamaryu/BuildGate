<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E1B4B">
    <title>BuildGate — Closed-Testing &amp; QA Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <style>
        @keyframes bgPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.06); opacity: 1; }
        }
        .bg-splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 100vh;
            background: #0F172A;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        }
        .bg-splash img {
            width: 76px;
            height: 76px;
            animation: bgPulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 12px 24px rgba(99, 102, 241, 0.35));
        }
        .bg-splash span {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #94A3B8;
        }
    </style>
</head>
<body style="margin: 0; background: #0F172A;">
    <div class="bg-splash">
        <img src="favicon.svg" alt="BuildGate Logo" />
        <span>Loading BuildGate Hub...</span>
    </div>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
